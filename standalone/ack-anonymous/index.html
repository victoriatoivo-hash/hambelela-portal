<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Anonymous reporting · Hambelela</title><link rel="stylesheet" href="style.css">
<main><p>Acknowledgments</p><h1>Anonymous reporting</h1><p>Only the designated Owner can read and reply. No employee identity is attached. Avoid names or details that could identify you. Nothing is added to your dashboard.</p>
<section><h2>Submit a report</h2><label>Your report<textarea id="body" rows="5" maxlength="6000"></textarea></label><button id="send">Submit anonymously</button><p id="sent" role="status"></p><output id="receipt"></output></section>
<section><h2>Check for a reply</h2><label>Private access code<input id="code" autocomplete="off" spellcheck="false"></label><button id="check">Check reply</button><p id="reply" role="status"></p></section>
</main><script src="client.js"></script></html>
