plugins { id 'com.android.application' }
android {
    namespace 'com.hambelela.deliverytracker'
    compileSdk 35
    defaultConfig { applicationId 'com.hambelela.deliverytracker'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs += ['../../../assets/fonts']
    buildTypes { release { minifyEnabled false } }
}
