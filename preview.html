<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Preview</title>
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Hambelela <span>Business Portal</span></a>
    <div class="account">
      <div><strong>Victoria Toivo</strong><small>Admin</small></div>
      <a class="logout" href="#">Logout</a>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" aria-label="Portal navigation">
      <nav>
        <a class="active" href="#"><span>&#9638;</span><span>Dashboard</span></a>
        <a href="#"><span>$</span><span>Cost Manager</span></a>
      </nav>
    </aside>
    <main class="workspace launcher">
      <section class="launcher-hero">
        <h1>essentials <span class="mascot" aria-hidden="true">&#9822;</span></h1>
        <p>your business command center</p>
      </section>
      <section class="app-grid" aria-label="Business apps">
        <a class="app-card is-active" href="#"><span class="app-icon pink"></span><strong>Cost Manager</strong><small>track your margins and profitability</small></a>
        <div class="app-card is-muted"><span class="soon">Soon</span><span class="app-icon peach"></span><strong>Inventory</strong><small>stock levels and reorder alerts</small></div>
        <div class="app-card is-muted"><span class="soon">Soon</span><span class="app-icon violet"></span><strong>VAT Tracker</strong><small>calculate and track returns</small></div>
        <div class="app-card is-muted"><span class="soon">Soon</span><span class="app-icon blue"></span><strong>HR Portal</strong><small>staff records and HR tools</small></div>
      </section>
    </main>
  </div>
</body>
</html>
