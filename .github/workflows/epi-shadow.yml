name: EPI shadow setup and watchdog
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, activate, tick]
        required: true
      approved_sha:
        type: string
        required: true
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'tick'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['7.4', '8.2']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['33317:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
      - run: |
          php -l shared/epi/ShadowActivation.php
          php -l apps/operations/epi-v2-shadow.php
          php tests/epi-v2-p0-forensic-db.php > epi-shadow-tests.json
          node tests/epi-v2-p0-static.mjs
          python3 -m py_compile scripts/epi-shadow-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-tests-${{ matrix.php }}-${{ github.run_id }}
          path: epi-shadow-tests.json
  execute:
    needs: verify
    if: always() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && ((github.event_name == 'schedule' && vars.EPI_SHADOW_WATCHDOG_ENABLED == 'true') || inputs.mode == 'tick')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned protected shadow operation
        env:
          MODE: ${{ inputs.mode || 'tick' }}
          APPROVED_SHA: ${{ inputs.approved_sha || github.sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/epi-shadow-release.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-result-${{ github.run_id }}
          path: |
            epi-shadow-result.json
            epi-shadow-backup.zip
