name: Payment sync live baseline check
on:
  push:
    branches: [codex/dpo-eft-payment-sync]
    paths: [.github/workflows/payment-sync-preflight.yml, scripts/payment-sync-preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare four live files to repository history (read only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/payment-sync-preflight.py
