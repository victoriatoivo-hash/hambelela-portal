name: Packaging label cost delta
on:
  push:
    branches: [codex/packaging-label-cost]
    paths: [.github/workflows/packaging-label-cost.yml]
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Test label allowance and pricing regressions
        run: |
          php -l shared/cost-workbook.php
          php -l apps/cost-manager/packaging-costs-api.php
          node --check assets/js/packaging-costs.js
          php tests/packaging-label-cost.php
          php tests/packaging-costs-workflow.php
          php tests/product-pricing-workflow.php
      - name: Verify and deploy three isolated runtime files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 scripts/deploy-packaging-label-cost.py preflight "$GITHUB_SHA"
          python3 scripts/deploy-packaging-label-cost.py deploy "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-label-cost-rollback-${{ github.run_id }}
          path: |
            packaging-label-cost-backup.zip
            packaging-label-cost-report.json
          retention-days: 14
          if-no-files-found: warn
