name: Packaging label cost delta
on:
  push:
    branches: [codex/packaging-label-cost]
    paths: [.github/workflows/packaging-label-cost.yml]
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify live baseline only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-packaging-label-cost.py inspect "$GITHUB_SHA"
