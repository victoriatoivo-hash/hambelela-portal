name: Deploy approved login visual only
on:
  workflow_dispatch:
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pinned presentation-only release
        run: |
          python3 scripts/deploy-login-visual.py --dry-run
          git show 9fe4919a2a7600e1b3ca8215e14e8989ae222685:login.php | php -l
      - name: Back up and publish six approved files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-login-visual.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-visual-backup-${{ github.run_id }}
          path: |
            login-visual-backup.zip
            login-visual-report.json
          if-no-files-found: warn
