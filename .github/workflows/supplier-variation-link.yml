name: Supplier unit draft linking correction
# Preserve blank working prices in the verified matching preview.
on:
  push:
    branches: [codex/supplier-variation-link]
    paths: [.github/workflows/supplier-variation-link.yml]
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: cw_supplier_test
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated variation matching and existing matching
        env:
          CW_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=cw_supplier_test
          CW_TEST_USER: root
        run: |
          php tests/product-unit-draft-linking.php
          php tests/product-link-count-regression.php
          node --check assets/js/retail-pricing.js
          npm install --prefix /tmp/supplier-link-test jsdom@26
          NODE_PATH=/tmp/supplier-link-test/node_modules node tests/product-cost-linking-ui.cjs
      - name: Deploy tested isolated files with targeted backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-supplier-variation-link.py deploy "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-variation-link-rollback
          path: |
            supplier-variation-link-report.json
            supplier-variation-link-backup.zip
          retention-days: 14
