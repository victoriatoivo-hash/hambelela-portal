name: Deploy approved Error Log redesign
on:
  workflow_dispatch:
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/deploy-error-log-release.py
          php -l apps/operations/errors.php
          node --check assets/js/error-log-workspace.js
      - name: Back up and publish three approved files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-error-log-release.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: error-log-release-${{ github.run_id }}
          path: |
            error-log-release-backup.zip
            error-log-release-report.json
