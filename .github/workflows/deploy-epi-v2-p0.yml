name: Deploy dormant EPI V2 P0
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed commit
        required: true
        type: string
      mode:
        description: Read-only host preflight or dormant code deployment (no migration/activation)
        required: true
        type: choice
        options: [preflight, deploy]
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['7.4', '8.2']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['33317:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
      - name: Full synthetic P0 verification on release PHP
        run: |
          php --version
          php tests/epi-v2-p0-forensic-db.php > epi-ci-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epi-compatibility-${{ matrix.php }}-${{ github.run_id }}
          path: epi-ci-results.json
  deploy:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Validate exact release
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git diff --name-only 524f89c2546e49bd68fe2e4f46c48b19e132f18c HEAD -- '*.php' | xargs -r -n1 php -l
          node tests/epi-v2-p0-static.mjs
          node tests/epi-automatic-scoring-static.mjs
          python3 -m py_compile scripts/deploy-epi-v2-p0.py
          python3 scripts/deploy-epi-v2-p0.py validate "$APPROVED_SHA"
      - name: Guarded dormant release
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          MODE: ${{ inputs.mode }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-epi-v2-p0.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epi-v2-p0-release-${{ github.run_id }}
          path: |
            epi-v2-p0-deployment-report.json
            epi-v2-p0-deployment-backup.zip
