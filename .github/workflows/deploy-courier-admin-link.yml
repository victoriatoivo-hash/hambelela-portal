name: Deploy explicit supplier to website cost matching
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, deploy]
        required: true
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cw_supplier_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql
      - name: Focused checks
        env:
          CW_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=cw_supplier_test;charset=utf8mb4
          CW_TEST_USER: root
        run: |
          # Shared costing changes are based on the verified live version and tested as deployed.
          php -l apps/hr-portal/documents.php
          php -l apps/hr-portal/includes/employment-letter.php
          php tests/employment-letters-workflow.php
          php -l shared/cost-workbook.php
          php -l shared/cost-workbook-invoice-recovery.php
          php -l shared/cost-workbook-supplier-sheet.php
          php -l apps/cost-manager/supplier-invoices-api.php
          php -l shared/cost-workbook-supplier-invoices.php
          php tests/supplier-costs-workflow.php
          php -l shared/cost-workbook-packaging-costs.php
          php tests/packaging-costs-workflow.php
          node --check assets/js/packaging-costs.js
          php -l shared/cost-workbook-pricing-discovery.php && php -l shared/cost-workbook-website-pricing.php && php -l apps/cost-manager/cw-api.php && php -l shared/cost-workbook-pricing-master.php
          php -l shared/cost-workbook-pricing-autosave.php
          php -l shared/cost-workbook-cost-linking.php
          php -l apps/cost-manager/retail-pricing-api.php
          php -l shared/cost-workbook-retail-pricing.php
          php -l shared/cost-workbook-page-shell.php
          php -l shared/ess-sidebar.php
          php -l shared/ess-navigation.php
          node --check assets/js/ess-sidebar.js
          node --check assets/js/ess-dashboard.js
          php -l shared/cost-workbook-sections.php
          php tests/product-pricing-workflow.php && php tests/product-pricing-sync.php
          php tests/product-cost-linking.php
          node --check assets/js/retail-pricing.js
          node tests/product-pricing-order.cjs
          node tests/cost-workbook-retail-pricing-static.mjs
          node --check assets/js/supplier-invoices-v2.js
          php -l shared/cost-workbook-formulation-engine.php
          php -l shared/cost-workbook-formulations.php
          php -l apps/cost-manager/formulations-api.php
          php tests/formulations-workflow.php
          node --check assets/js/formulation-costing.js
      - name: Drawer interaction tests (disposable DOM, no live records)
        run: |
          npm install --prefix "$RUNNER_TEMP/supplier-ui" --no-audit --no-fund jsdom@24.1.3
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/supplier-costs-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/packaging-costs-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/product-pricing-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/product-cost-linking-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/product-pricing-filters-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/product-pricing-scroll-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/ess-sidebar-ui.cjs
          NODE_PATH="$RUNNER_TEMP/supplier-ui/node_modules" node tests/formulations-ui.cjs
      - name: Hash guarded delta with targeted backup and rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-size-conversions.py '${{ inputs.mode }}' '${{ inputs.approved_sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-costs-release-${{ github.run_id }}
          path: |
            supplier-costs-deployment-report.json
            supplier-costs-deployment-backup.zip
          retention-days: 3
          if-no-files-found: ignore
