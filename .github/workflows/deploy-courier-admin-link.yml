name: Deploy Courier admin linking

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only or deploy the approved Courier delta
        required: true
        type: choice
        options:
          - preflight
          - deploy
      approved_sha:
        description: Exact main commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-courier-admin-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Courier release
        run: |
          php -l apps/operations/courier.php
          node tests/courier-sent-state-static.mjs
          python3 -m py_compile scripts/deploy-courier-admin-link.py
      - name: Back up and publish only the approved Courier files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-courier-admin-link.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courier-admin-link-${{ github.run_id }}
          path: |
            courier-admin-link-deployment-report.json
            courier-admin-link-deployment-backup.zip
          if-no-files-found: warn
