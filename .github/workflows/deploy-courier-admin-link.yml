name: Deploy Employee Performance workspace delta

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight or deploy the isolated Performance dashboard
        required: true
        type: choice
        options:
          - preflight
          - deploy
      approved_sha:
        description: Exact main commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-courier-admin-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Validate Performance workspace release
        run: |
          php -l apps/operations/reports.php
          php -l apps/operations/reports-data.php
          php -l apps/operations/performance-workspace.php
          php -l apps/operations/performance-activity.php
          php tests/performance-activity.php
          node --check assets/js/performance-workspace.js
          npm install --prefix "$RUNNER_TEMP/performance-ui" --no-audit --no-fund jsdom@24.1.3
          NODE_PATH="$RUNNER_TEMP/performance-ui/node_modules" node tests/performance-workspace-ui.cjs
          python3 -m py_compile scripts/deploy-performance-workspace.py
      - name: Back up and publish only the approved Performance files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-performance-workspace.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-workspace-${{ github.run_id }}
          path: |
            performance-workspace-deployment-report.json
            performance-workspace-deployment-backup.zip
          retention-days: 3
          if-no-files-found: warn
