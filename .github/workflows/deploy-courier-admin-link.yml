name: Deploy Supplier Costs isolated workflow
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, deploy]
        required: true
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cw_supplier_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql
      - name: Focused checks
        env:
          CW_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=cw_supplier_test;charset=utf8mb4
          CW_TEST_USER: root
        run: |
          php -l shared/cost-workbook.php
          php -l apps/cost-manager/supplier-invoices-api.php
          php -l apps/cost-manager/landed-product-costs-api.php
          php tests/supplier-costs-workflow.php
          php -l shared/cost-workbook-sections.php
          node --check assets/js/size-conversions.js
          node tests/cost-workbook-size-conversions-static.mjs
          node tests/size-conversions-interactions.mjs
          php tests/size-conversions-values.php
      - name: Hash guarded delta with targeted backup and rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-size-conversions.py '${{ inputs.mode }}' '${{ inputs.approved_sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-conversions-release-${{ github.run_id }}
          path: |
            size-conversions-deployment-report.json
            size-conversions-deployment-backup.zip
          retention-days: 3
          if-no-files-found: ignore
