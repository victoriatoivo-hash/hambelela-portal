name: Deploy Size Conversions isolated redesign
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, deploy]
        required: true
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Focused checks
        run: |
          php -l shared/cost-workbook-sections.php
          node --check assets/js/size-conversions.js
          node tests/cost-workbook-size-conversions-static.mjs
          node tests/size-conversions-interactions.mjs
          php tests/size-conversions-values.php
      - name: Hash guarded delta with targeted backup and rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-size-conversions.py '${{ inputs.mode }}' '${{ inputs.approved_sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-conversions-release-${{ github.run_id }}
          path: |
            size-conversions-deployment-report.json
            size-conversions-deployment-backup.zip
          retention-days: 3
          if-no-files-found: ignore
