name: Deploy Portal by FTP

on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    if: false # Retained for history; production deployment is manual via deploy-approved-change.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Validate Import VAT parser and PHP syntax
        run: |
          php -l shared/accounts-import-vat-parser.php
          php -l shared/accounts-import-vat.php
          php -l apps/accounts/import-vat-api.php
          php -l apps/accounts/import-vat-api-legacy.php
          php tests/accounts-import-vat-parser.php
          node tests/accounts-import-vat-static.mjs

      - name: Deploy to cPanel FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/uploads/**
            **/leave_attachments/**
            **/error_log
            **/config.local.php
            **/default-login-accounts.txt
