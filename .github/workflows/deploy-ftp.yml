name: Deploy Portal by FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to cPanel FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/uploads/**
            **/leave_attachments/**
            **/error_log
            **/config.local.php
            **/default-login-accounts.txt
