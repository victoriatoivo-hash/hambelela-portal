name: System Issues PR validation
on:
  pull_request:
    paths:
      - 'apps/operations/system-issue*'
      - 'shared/system-issue*'
      - 'assets/js/system-issue-workflow.js'
      - 'tests/system-issues*'
      - '.github/workflows/system-issues-pr-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.php' | xargs -r -n1 php -l
      - name: JavaScript syntax
        run: node --check assets/js/system-issue-workflow.js
      - name: Static checks
        run: for test in tests/system-issues-static.mjs tests/system-issues-*-static.mjs; do node "$test"; done
      - name: Behavioural checks
        run: php tests/system-issues-workflow-behaviour.php
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
