name: EPI stage guarded dormant publication
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, publish]
        required: true
      approved_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['7.4', '8.2']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['33317:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
      - run: |
          python3 tests/epi-stage-release-test.py
          php tests/epi-v2-p0-forensic-db.php > epi-stage-tests.json
          php tests/epi-hr-absence-evidence.php
          node tests/epi-v2-p0-static.mjs
          node --check assets/js/front-coverage.js
          python3 -m py_compile scripts/epi-stage-release.py scripts/epi-shadow-release.py scripts/epi-stage-package.py
          python3 -c "import importlib.util,subprocess; s=importlib.util.spec_from_file_location('p','scripts/epi-stage-package.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); [subprocess.run(['php','-l',p],check=True) for p in m.RUNTIME if p.endswith('.php')]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epi-stage-tests-${{ matrix.php }}-${{ github.run_id }}
          path: epi-stage-tests.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded release, features remain off
        env:
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/epi-stage-release.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epi-stage-release-${{ github.run_id }}
          path: |
            epi-stage-result.json
            epi-stage-backup.zip
