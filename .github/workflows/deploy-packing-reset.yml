name: Deploy Packing upload reset only

on:
  workflow_dispatch:

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate isolated fix and run regression checks
        run: |
          git fetch origin codex/packing-horizontal-cards
          test "$(git rev-parse FETCH_HEAD)" = '4e5d4ef656deef249cd6aa0d6419b8fa193d86b0'
          python3 scripts/deploy-approved-packing-reset.py --dry-run 4e5d4ef656deef249cd6aa0d6419b8fa193d86b0
          git worktree add /tmp/packing-reset-check 4e5d4ef656deef249cd6aa0d6419b8fa193d86b0
          cd /tmp/packing-reset-check
          node --check /tmp/packing-reset-check/assets/js/packing-list.js
          node /tmp/packing-reset-check/tests/packing-upload-reset.cjs
          node /tmp/packing-reset-check/tests/packing-review-click.cjs
          node /tmp/packing-reset-check/tests/packing-single-page.cjs
          node /tmp/packing-reset-check/tests/packing-workload-cards.cjs
          php -l apps/operations/consignments.php
          php -l apps/operations/packing-list-data.php
          node /tmp/packing-reset-check/tests/packing-manual-distribution-static.mjs
      - name: Back up and deploy only the Packing controller
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-packing-reset.py --deploy 4e5d4ef656deef249cd6aa0d6419b8fa193d86b0
      - name: Preserve backup and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packing-reset-backup-${{ github.run_id }}
          path: |
            packing-reset-deployment-backup.zip
            packing-reset-deployment-report.json
          if-no-files-found: warn
