name: Deploy Packing upload reset only

on:
  workflow_dispatch:

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate isolated fix and run regression checks
        run: |
          git fetch origin codex/packing-review-click-fix
          test "$(git rev-parse FETCH_HEAD)" = 'afcc671e9fd3f3165138b9bef71f55cf7453ca81'
          python3 scripts/deploy-approved-packing-reset.py --dry-run afcc671e9fd3f3165138b9bef71f55cf7453ca81
          git worktree add /tmp/packing-reset-check afcc671e9fd3f3165138b9bef71f55cf7453ca81
          cd /tmp/packing-reset-check
          node --check /tmp/packing-reset-check/assets/js/packing-list.js
          node /tmp/packing-reset-check/tests/packing-upload-reset.cjs
          node /tmp/packing-reset-check/tests/packing-review-click.cjs
          node /tmp/packing-reset-check/tests/packing-manual-distribution-static.mjs
      - name: Back up and deploy only assets/js/packing-list.js
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-packing-reset.py --deploy afcc671e9fd3f3165138b9bef71f55cf7453ca81
      - name: Preserve backup and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packing-reset-backup-${{ github.run_id }}
          path: |
            packing-reset-deployment-backup.zip
            packing-reset-deployment-report.json
          if-no-files-found: warn
