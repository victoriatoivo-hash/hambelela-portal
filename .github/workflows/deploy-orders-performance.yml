name: Deploy Orders performance optimization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only or deploy the approved Orders optimization
        required: true
        type: choice
        options:
          - preflight
          - deploy
      approved_sha:
        description: Exact main commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-orders-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Validate Orders optimization
        run: |
          php -l apps/operations/orders-board-data.php
          node --check assets/js/orders-board.js
          node --test tests/orders-performance-static.mjs tests/orders-board-loading-ux-static.mjs tests/orders-premium-ui-static.mjs
          python3 -m py_compile scripts/deploy-orders-performance.py
      - name: Back up and publish only the approved Orders files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-orders-performance.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders-performance-${{ github.run_id }}
          path: |
            orders-performance-deployment-report.json
            orders-performance-deployment-backup.zip
          if-no-files-found: warn
