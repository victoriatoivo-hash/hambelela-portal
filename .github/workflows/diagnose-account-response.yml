name: HR access diagnosis and scoped release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, cleanup]
        default: audit
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: php -l tools/hr-access-audit.php
      - name: Inspect account code and relevant PHP errors without changing data
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/hr-access-audit-release.py '${{ inputs.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-access-audit-${{ github.run_id }}
          path: |
            hr-access-live-source.zip
            hr-access-audit-report.json
          retention-days: 7
