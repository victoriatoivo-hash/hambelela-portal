name: Diagnose account response (read only)
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Export task popup source without changing production
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/task-popup-live-export.py
      - uses: actions/upload-artifact@v4
        with:
          name: task-popup-live-source
          path: |
            task-popup-live-source.zip
            task-popup-live-hashes.json
          retention-days: 7
