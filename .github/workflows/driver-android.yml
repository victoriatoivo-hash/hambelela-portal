name: Build Driver Android APK
on:
  push:
    branches: [codex/driver-android-apk]
    paths: ['android-driver/**', '.github/workflows/driver-android.yml', 'scripts/release-driver-android-association.py']
permissions:
  contents: read
concurrency:
  group: driver-android-package
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Check package security contract
        run: |
          python3 android-driver/tests/package_contract.py
          python3 android-driver/tests/association_release.py
      - name: Build and lint without private keys
        run: gradle -p android-driver --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare unsigned APK and standard signing tool
        run: |
          mkdir android-package
          cp android-driver/app/build/outputs/apk/release/app-release-unsigned.apk android-package/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-package/
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android-package/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-package/app-release-unsigned.apk > android-package/package-info.txt
          cp android-driver/app/build/reports/lint-results-release.html android-package/
          sha256sum android-package/* > android-package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: driver-android-unsigned-${{ github.sha }}
          path: android-package/
          if-no-files-found: error
          retention-days: 30
  associate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-delta-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the public Android ownership certificate
        env:
          APPROVED_SHA: ${{ github.sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/release-driver-android-association.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-android-association-${{ github.sha }}
          path: android-association-report.json
          if-no-files-found: warn
