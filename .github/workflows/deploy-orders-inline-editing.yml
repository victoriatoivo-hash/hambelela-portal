name: Delivery arrangement repair source and delta
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [export, preflight, deploy]
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Delivery arrangement regression gates
        if: inputs.mode != 'export'
        env:
          DELIVERY_TEST_DSN: mysql:host=127.0.0.1;port=3306
          DELIVERY_TEST_PASSWORD: synthetic-ci-password
        run: |
          php tests/delivery-arrangement-regression.php
          node tests/delivery-notification-ui.mjs
          node --check assets/js/delivery-core.js
          node --check assets/js/portal.js
          php -l apps/delivery/front-api.php
          php -l shared/delivery/CoreApi.php
          php -l shared/delivery/EmployeeDriverSession.php
          php -l shared/delivery/NotificationOutbox.php
          php -l shared/delivery/PortalOrderRepository.php
      - name: Capture or publish exact isolated files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/delivery-arrangement-release.py "$RELEASE_MODE" "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-arrangement-${{ github.run_id }}
          retention-days: 3
          path: |
            delivery-arrangement-live-source.zip
            delivery-arrangement-release-report.json
            delivery-arrangement-backup.zip
