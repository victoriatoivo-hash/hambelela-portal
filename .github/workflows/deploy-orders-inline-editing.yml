name: Delivery GPS source verification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [inspect, test]
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android companion (not a signed production release)
        working-directory: android/delivery-tracker
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-tracker-build-${{ github.run_id }}
          retention-days: 3
          path: |
            android/delivery-tracker/app/build/outputs/apk/release/*unsigned.apk
            android/delivery-tracker/app/build/reports/lint-results-release.*
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact requested revision
        env:
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Synthetic GPS tests
        run: |
          php tests/delivery-tracking-policy.php
          php tests/delivery-tracking-storage.php
          php -l shared/delivery/TrackingSchema.php
          php -l shared/delivery/TrackingService.php
          php -l shared/delivery/TrackingMaps.php
          php -l shared/delivery/TrackingConfiguration.php
          php -l apps/delivery/tracking.php
          php -l apps/delivery/tracking-api.php
          php -l apps/delivery/tracking-device.php
          node --check assets/js/delivery-tracking.js
      - name: Capture isolated live source
        if: inputs.mode == 'inspect'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/delivery-gps-release.py "$RELEASE_MODE" "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-gps-${{ github.run_id }}
          retention-days: 3
          path: |
            delivery-gps-source.zip
            delivery-gps-report.json
