name: Marketing workflow source and delta
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [export, preflight, deploy]
      scope:
        type: choice
        default: marketing
        options: [marketing, orders-mobile]
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Marketing transitions, timers, permissions and popup persistence
        if: inputs.mode != 'export' && inputs.scope != 'orders-mobile'
        env:
          MARKETING_TEST_DSN: mysql:host=127.0.0.1;port=3306
          MARKETING_TEST_PASSWORD: synthetic-ci-password
        run: |
          php tests/marketing-workflow-db.php
          php tests/notification-session-lock.php
          node tests/marketing-workflow-clock.mjs
          node tests/marketing-modal-dismissal.mjs
          node --check assets/js/marketing-workspace.js
          node --check assets/js/marketing.js
          node --check assets/js/portal.js
          php -l apps/marketing/execution.php
          php -l apps/marketing/index.php
          php -l shared/marketing-content-workflow.php
          php -l shared/marketing-execution.php
          php -l shared/notifications.php
      - name: Check Orders JavaScript
        if: inputs.scope == 'orders-mobile'
        run: |
          node --check assets/js/orders-board.js
          node tests/orders-inline-editing-persistence-static.mjs
          node tests/portal-corrections-static.mjs
          node tests/orders-paid-ui-behavior.mjs
          node tests/orders-mobile-scroll.mjs
          node --check assets/js/packing-list.js
          node --check assets/js/portal-responsive.js
          node tests/mobile-interface-behavior.mjs
      - name: Capture or publish exact isolated files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: |
          if [ "$RELEASE_SCOPE" = "orders-mobile" ]; then
            python3 scripts/orders-mobile-release.py "$RELEASE_MODE" "$RELEASE_SHA"
          else
            python3 scripts/marketing-workflow-release.py "$RELEASE_MODE" "$RELEASE_SHA"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-workflow-${{ github.run_id }}
          retention-days: 3
          path: |
            marketing-workflow-live-source.zip
            marketing-workflow-release-report.json
            marketing-workflow-backup.zip
            verification/rendered/
            orders-mobile-live-source.zip
            orders-mobile-release-report.json
            orders-mobile-backup.zip
