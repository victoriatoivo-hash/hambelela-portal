name: Acknowledgment scheduling source and delta
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source revision
        env:
          SHA: ${{ inputs.approved_sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Read approved live source files only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ack-schedule-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: acknowledgment-source-${{ github.run_id }}
          retention-days: 3
          path: ack-live-source.zip
