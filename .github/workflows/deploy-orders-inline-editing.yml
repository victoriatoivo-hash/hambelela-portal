name: Marketing refinement source and delta
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [export, preflight, deploy]
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Capture or publish exact isolated files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/marketing-refinement-release.py "$RELEASE_MODE" "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-refinement-${{ github.run_id }}
          retention-days: 3
          path: |
            marketing-live-source.zip
            marketing-release-report.json
            marketing-backup.zip
