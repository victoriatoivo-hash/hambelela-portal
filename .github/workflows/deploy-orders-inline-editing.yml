name: Deploy Orders search and selection totals

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export, preflight or deploy the isolated Orders search and selection change
        required: true
        type: choice
        options:
          - export
          - preflight
          - deploy
      approved_sha:
        description: Exact checkout commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-orders-inline-editing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scoped delivery change
        run: |
          python3 -m py_compile scripts/deploy-delivery-single-list.py
          node --check assets/js/delivery-back-capture.js
          node tests/delivery-single-list.cjs
      - name: Back up and publish only approved Orders files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-delivery-single-list.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders-inline-editing-${{ github.run_id }}
          path: |
            delivery-single-list-live-source.zip
            delivery-single-list-deployment-report.json
            delivery-single-list-deployment-backup.zip
          if-no-files-found: warn
