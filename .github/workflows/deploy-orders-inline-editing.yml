name: Deploy Tedlaser access delta

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export, preflight or deploy the isolated Tedlaser access change
        required: true
        type: choice
        options:
          - export
          - preflight
          - deploy
      approved_sha:
        description: Exact checkout commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-orders-inline-editing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scoped delivery change
        run: |
          python3 -m py_compile scripts/deploy-delivery-single-list.py
          node --check assets/js/delivery-partner.js
          node --check assets/js/delivery-partner-admin.js
          node --check assets/js/delivery-accounting.js
          node --check assets/js/delivery-partner-reset.js
          TEDLASER_TEST_DSN='mysql:host=127.0.0.1;port=3306' TEDLASER_TEST_PASSWORD='synthetic-ci-password' php tests/tedlaser-access-db.php
      - name: Back up and publish only approved Tedlaser files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-delivery-single-list.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders-inline-editing-${{ github.run_id }}
          path: |
            delivery-single-list-live-source.zip
            delivery-single-list-deployment-report.json
            delivery-single-list-deployment-backup.zip
          if-no-files-found: warn
