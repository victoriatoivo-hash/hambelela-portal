name: Marketing workflow source and delta
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [export, preflight, deploy]
      approved_sha:
        type: string
        required: true
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify packing grammar, distribution and atomic creation
        if: inputs.mode != 'export'
        run: |
          node --check assets/js/packing-list.js
          php -l apps/operations/consignments.php
          php -l apps/operations/packing-list-action.php
          node tests/packing-quantity.mjs
          php tests/packing-quantity.php
          node tests/packing-wizard.mjs
          php tests/packing-wizard.php
          php tests/packing-wizard-batch.php
          node tests/packing-multi-manual-static.mjs
          node tests/packing-invoice-two-stage-workflow-static.mjs
          node tests/packing-invoice-physical-workload-static.mjs
      - name: Capture or publish exact isolated files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/marketing-workflow-release.py "$RELEASE_MODE" "$RELEASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-workflow-${{ github.run_id }}
          retention-days: 3
          path: |
            marketing-workflow-live-source.zip
            marketing-workflow-release-report.json
            marketing-workflow-backup.zip
