name: Read-only coordinated release source check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/codex/acknowledgments-packing-payment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current live source (no uploads)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/coordinated-snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-live-source
          path: coordinated-live-source.zip
          retention-days: 3
