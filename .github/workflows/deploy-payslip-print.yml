name: Deploy HR bonus payroll (review branch)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only or deploy the approved HR bonus files
        required: true
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
      approved_sha:
        description: Exact HR bonus review branch commit SHA
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  release-hr-bonus:
    if: github.ref == 'refs/heads/hr/performance-bonus-payroll-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
      - name: Test exact reviewed PHP files and bonus validation
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          for f in apps/hr-portal/payroll.php apps/hr-portal/my-payslips.php apps/hr-portal/self-service.php apps/hr-portal/includes/loan-agreements.php apps/hr-portal/includes/payroll-bonus.php; do php -l "$f"; done
          php tests/hr-payroll-bonus.php
          python3 -m py_compile scripts/deploy-hr-bonus.py
      - name: Read-only baseline check and guarded release
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-hr-bonus.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-bonus-release-${{ github.run_id }}
          path: hr-bonus-deployment-report.json
          if-no-files-found: warn
