name: Deploy driver background updates
on:
  workflow_call:
    inputs:
      approved_sha:
        description: Approved production merge commit
        required: true
        type: string
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/driver-background-updates' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '7.4', extensions: mbstring, coverage: none}
      - name: Verify exact admin release and read-only bridge
        run: |
          node tests/owner-view/bridge.cjs
          APPROVED_SHA="${{ inputs.approved_sha }}" python3 scripts/release-admin-driver.py
      - name: Back up, publish exact delta and verify HTTPS assets
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/release-admin-driver.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-driver-recovery-${{ github.run_id }}
          path: |
            admin-driver-code-backup.zip
            admin-driver-report.json
          if-no-files-found: warn
          retention-days: 90
