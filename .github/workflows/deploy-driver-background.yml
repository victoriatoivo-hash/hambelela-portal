name: Deploy driver background updates
on:
  workflow_call:
    inputs:
      approved_sha:
        description: Approved production merge commit
        required: true
        type: string
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/driver-background-updates' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '7.4', extensions: mbstring, coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify Delivery integration and read-only safeguards
        run: |
          npm install --prefix "$RUNNER_TEMP/delivery-ui" --ignore-scripts --no-audit --no-fund jsdom@24.1.3
          export NODE_PATH="$RUNNER_TEMP/delivery-ui/node_modules"
          PHP_BIN=php node tests/owner-operations/client.cjs
          node tests/owner-proof/client.cjs
          node tests/owner-view/bridge.cjs
          php tests/owner-operations/shell.php
          node tests/delivery-consolidation/contracts.cjs
          APPROVED_SHA="${{ inputs.approved_sha }}" python3 scripts/release-delivery-admin-consolidation.py
      - name: Back up, publish exact delta and verify HTTPS assets
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/release-delivery-admin-consolidation.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-admin-consolidation-recovery-${{ github.run_id }}
          path: |
            delivery-admin-consolidation-backup.zip
            delivery-admin-consolidation-report.json
          if-no-files-found: warn
          retention-days: 90
