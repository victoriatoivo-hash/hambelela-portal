name: Deploy approved portal change

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Approved isolated change commit SHA
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy-marketing-bookkeeping-visibility:
    if: inputs.approved_sha == '17e65ea768616207931ac96bc616536307f379b5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate two-file Marketing Bookkeeping visibility release
        run: |
          git fetch origin codex/settings-only-release
          git fetch origin codex/unified-sidebar
          git fetch origin codex/marketing-bookkeeping-visibility
          test "$(git rev-parse FETCH_HEAD)" = '17e65ea768616207931ac96bc616536307f379b5'
          python3 scripts/deploy-marketing-bookkeeping-visibility.py --dry-run 17e65ea768616207931ac96bc616536307f379b5
      - name: Back up and deploy the two approved files only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-marketing-bookkeeping-visibility.py --deploy 17e65ea768616207931ac96bc616536307f379b5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-bookkeeping-visibility-${{ github.run_id }}
          path: |
            marketing-bookkeeping-visibility-backup.zip
            marketing-bookkeeping-visibility-report.json
          if-no-files-found: warn
  deploy-sidebar:
    if: inputs.approved_sha == '2733fcf5b1d86e82cce00a8b4f6c59b76a9eb55e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned sidebar release
        run: |
          git fetch origin codex/unified-sidebar
          test "$(git rev-parse FETCH_HEAD)" = '2733fcf5b1d86e82cce00a8b4f6c59b76a9eb55e'
          python3 scripts/deploy-sidebar-release.py --dry-run '2733fcf5b1d86e82cce00a8b4f6c59b76a9eb55e'
      - name: Deploy sidebar files with baseline verification and backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-sidebar-release.py --deploy '2733fcf5b1d86e82cce00a8b4f6c59b76a9eb55e'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-release-${{ github.run_id }}
          path: |
            settings-release-backup.zip
            settings-release-report.json
          if-no-files-found: warn
  deploy-settings:
    if: inputs.approved_sha == '7fa04c0848a428889c7d5f82f745789e07024ed6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate isolated Settings release
        run: |
          git fetch origin codex/account-response-compatibility
          git fetch origin codex/settings-only-release
          test "$(git rev-parse FETCH_HEAD)" = '7fa04c0848a428889c7d5f82f745789e07024ed6'
          python3 scripts/deploy-settings-release.py --dry-run 7fa04c0848a428889c7d5f82f745789e07024ed6
      - name: Back up and deploy Settings only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-settings-release.py --deploy 7fa04c0848a428889c7d5f82f745789e07024ed6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-release-${{ github.run_id }}
          path: |
            settings-release-backup.zip
            settings-release-report.json
          if-no-files-found: warn
  deploy-profile-popup:
    if: inputs.approved_sha == '4998ed767fc569514162961210c939d2a7b98af0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate five-file profile popover release
        run: |
          git fetch origin codex/profile-popup-only
          test "$(git rev-parse FETCH_HEAD)" = '4998ed767fc569514162961210c939d2a7b98af0'
          python3 scripts/deploy-profile-popup.py --dry-run 4998ed767fc569514162961210c939d2a7b98af0
      - name: Back up and deploy popover only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-profile-popup.py --deploy 4998ed767fc569514162961210c939d2a7b98af0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-popup-${{ github.run_id }}
          path: |
            profile-popup-backup.zip
            profile-popup-report.json
          if-no-files-found: warn
  deploy:
    if: inputs.approved_sha == '039dfc6e2957394254eb1f7287126e3db47f9bb7'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate the approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git fetch origin codex/notifications-export
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse "$APPROVED_SHA^")" = '26791347d9427272b39c2a29ed754f6087b2f5e9'
          python3 scripts/deploy-approved-notifications.py --dry-run "$APPROVED_SHA"
          git show "$APPROVED_SHA:notifications.php" | php -l
          git show "$APPROVED_SHA:shared/header.php" | php -l
      - name: Deploy eight approved files with backup and verification
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-notifications.py --deploy "$APPROVED_SHA"
      - name: Preserve backup and deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-deployment-backup-${{ github.run_id }}
          path: |
            notifications-deployment-backup.zip
            notifications-deployment-report.json
          if-no-files-found: warn
  deploy-marketing:
    if: inputs.approved_sha == '64704817531c2a7fe2747aa53e525c856a3e3dce'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate approved Marketing and employee sidebar release
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git fetch origin codex/marketing-assistant-cleanup
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          python3 scripts/deploy-approved-marketing.py --dry-run "$APPROVED_SHA"
      - name: Back up and deploy exact approved files
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-marketing.py --deploy "$APPROVED_SHA"
      - name: Preserve Marketing backup and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-deployment-backup-${{ github.run_id }}
          path: |
            marketing-deployment-backup.zip
            marketing-deployment-report.json
          if-no-files-found: warn
  deploy-marketing-front-views:
    if: inputs.approved_sha == 'c5d1e1e1fbfe2db738e8a1480120e1f59e72a09a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact Marketing view release
        run: |
          git fetch origin c95cdd5cdfc4c6184dd734cc3ce255f1f62ee94d
          git fetch origin codex/marketing-front-views
          test "$(git rev-parse FETCH_HEAD)" = 'c5d1e1e1fbfe2db738e8a1480120e1f59e72a09a'
          python3 scripts/deploy-marketing-front-views.py --dry-run c5d1e1e1fbfe2db738e8a1480120e1f59e72a09a
      - name: Back up and deploy five approved files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-marketing-front-views.py --deploy c5d1e1e1fbfe2db738e8a1480120e1f59e72a09a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-front-views-${{ github.run_id }}
          path: |
            marketing-front-views-backup.zip
            marketing-front-views-report.json
          if-no-files-found: warn
  deploy-packing:
    if: inputs.approved_sha == 'f70def1dab5f5d45da01f74cca749809f84aae94'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate the approved Packing commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git fetch origin codex/packing-manual-distribution
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse "$APPROVED_SHA^")" = 'e9da16165e8bb0c5593197b8aec27d3df9f998c5'
          python3 scripts/deploy-approved-packing.py --dry-run "$APPROVED_SHA"
          git show "$APPROVED_SHA:apps/operations/consignments.php" | php -l
          git show "$APPROVED_SHA:apps/operations/packing-list-action.php" | php -l
          git show "$APPROVED_SHA:assets/js/packing-list.js" > "$RUNNER_TEMP/approved-packing-list.js"
          node --check "$RUNNER_TEMP/approved-packing-list.js"
      - name: Deploy four Packing runtime files with backup and verification
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-packing.py --deploy "$APPROVED_SHA"
      - name: Preserve Packing backup and deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packing-deployment-backup-${{ github.run_id }}
          path: |
            packing-deployment-backup.zip
            packing-deployment-report.json
          if-no-files-found: warn
