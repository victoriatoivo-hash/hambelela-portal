name: Deploy approved portal change

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Approved isolated change commit SHA
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.approved_sha == '039dfc6e2957394254eb1f7287126e3db47f9bb7'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate the approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git fetch origin codex/notifications-export
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse "$APPROVED_SHA^")" = '26791347d9427272b39c2a29ed754f6087b2f5e9'
          python3 scripts/deploy-approved-notifications.py --dry-run "$APPROVED_SHA"
          git show "$APPROVED_SHA:notifications.php" | php -l
          git show "$APPROVED_SHA:shared/header.php" | php -l
      - name: Deploy eight approved files with backup and verification
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-notifications.py --deploy "$APPROVED_SHA"
      - name: Preserve backup and deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-deployment-backup-${{ github.run_id }}
          path: |
            notifications-deployment-backup.zip
            notifications-deployment-report.json
          if-no-files-found: warn
  deploy-packing:
    if: inputs.approved_sha == 'f70def1dab5f5d45da01f74cca749809f84aae94'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and validate the approved Packing commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git fetch origin codex/packing-manual-distribution
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse "$APPROVED_SHA^")" = 'e9da16165e8bb0c5593197b8aec27d3df9f998c5'
          python3 scripts/deploy-approved-packing.py --dry-run "$APPROVED_SHA"
          git show "$APPROVED_SHA:apps/operations/consignments.php" | php -l
          git show "$APPROVED_SHA:apps/operations/packing-list-action.php" | php -l
          git show "$APPROVED_SHA:assets/js/packing-list.js" > "$RUNNER_TEMP/approved-packing-list.js"
          node --check "$RUNNER_TEMP/approved-packing-list.js"
      - name: Deploy four Packing runtime files with backup and verification
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-approved-packing.py --deploy "$APPROVED_SHA"
      - name: Preserve Packing backup and deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packing-deployment-backup-${{ github.run_id }}
          path: |
            packing-deployment-backup.zip
            packing-deployment-report.json
          if-no-files-found: warn
