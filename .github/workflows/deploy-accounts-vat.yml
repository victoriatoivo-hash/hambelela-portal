name: Deploy Accounts VAT workspace delta
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify or deploy isolated NamRA account correction code
        required: true
        type: choice
        options: [preflight, deploy]
      approved_sha:
        description: Exact tested checkout SHA
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  import-vat-account-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Test tax-account boundaries and reversible ledger correction
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_sha }}"
          php -l shared/accounts-import-vat-parser.php
          php -l shared/accounts-import-vat-september-correction.php
          php -l apps/accounts/import-vat-api.php
          php -l apps/accounts/import-vat-api-legacy.php
          php -l apps/accounts/paye-api.php
          php -l apps/accounts/import-vat-september-correction.php
          php tests/import-vat-september-correction.php
          python3 -m py_compile scripts/deploy-import-vat-account-fix.py
      - name: Guard live baseline and deploy code only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-import-vat-account-fix.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-vat-fix-${{ github.run_id }}
          path: |
            import-vat-fix-report.json
            import-vat-fix-backup.zip
          retention-days: 3
          if-no-files-found: warn
