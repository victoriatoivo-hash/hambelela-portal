name: Deploy owner dashboard shortcuts
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preflight, deploy]
      approved_sha:
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  dashboard-shortcuts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Verify isolated owner dashboard change
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_sha }}"
          php -l shared/ess-dashboard.php
          php tests/owner-dashboard-shortcuts.php
          git diff --check
      - name: Guard live baseline and publish one template only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-dashboard-shortcuts.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-shortcuts-${{ github.run_id }}
          path: |
            dashboard-shortcuts-report.json
            dashboard-shortcuts-backup.zip
          retention-days: 3
          if-no-files-found: warn
