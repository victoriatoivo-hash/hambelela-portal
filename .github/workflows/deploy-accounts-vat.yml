name: Deploy Accounts VAT workspace delta
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify or deploy Accounts VAT workspace only
        required: true
        type: choice
        options: [preflight, deploy]
      approved_sha:
        description: Exact tested checkout SHA
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  accounts-vat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test isolated presentation and permission boundaries
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_sha }}"
          git diff --exit-code 033d24d881b5b11600e06c90f0801c594914f2c6 HEAD -- shared/accounts-input-vat.php shared/accounts-input-vat-calculator.php shared/accounts-output-vat.php apps/accounts/input-vat-api.php apps/accounts/output-vat-api.php apps/accounts/input-vat-file.php
          php -l apps/accounts/input-vat.php
          php -l apps/accounts/input-vat-live.php
          php -l apps/accounts/output-vat.php
          node --check assets/js/input-vat.js
          node --check assets/js/output-vat.js
          node --check assets/js/accounts-vat-workspace.js
          php tests/input-vat-mixed-vat.php
          node tests/input-vat-mixed-vat-static.mjs
          node tests/input-vat-manual-adjustment-static.mjs
          node tests/accounts-output-vat-static.mjs
          npm install --prefix "$RUNNER_TEMP/accounts-ui" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/accounts-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/accounts-ui/node_modules" node tests/accounts-vat-workspace-ui.cjs
          python3 -m py_compile scripts/deploy-accounts-vat.py
      - name: Guard live baseline and publish only the seven VAT presentation files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-accounts-vat.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-vat-${{ github.run_id }}
          path: |
            accounts-vat-report.json
            accounts-vat-backup.zip
          retention-days: 3
          if-no-files-found: warn
