name: Deploy task completion note policy
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [inspect, preflight, deploy]
      approved_sha:
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  task-note-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Verify task note policy and syntax
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.approved_sha }}"
          php -l apps/operations/checklists.php
          php tests/task-note-policy.php
          node tests/task-note-policy.mjs
          git diff --check
      - name: Guard live baseline and publish one template only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-task-note-policy.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-note-policy-${{ github.run_id }}
          path: |
            task-note-policy-report.json
            task-note-policy-backup.zip
          retention-days: 3
          if-no-files-found: warn
