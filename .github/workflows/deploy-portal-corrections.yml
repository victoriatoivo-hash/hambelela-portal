name: Deploy Task admin editing
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture source, preflight, or deploy scoped Task editing files
        required: true
        type: choice
        options: [export, preflight, deploy]
      approved_sha:
        description: Exact authorized branch commit SHA
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  task-admin-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-password
        ports: ['33319:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: fileinfo, pdo_mysql, pdo_sqlite
      - name: Verify corrections, preserved records and permissions
        if: inputs.mode != 'export'
        env:
          TASK_TEST_MYSQL_PASSWORD: fixture-password
        run: |
          php tests/task-admin-edit.php
          php tests/task-admin-permissions.php
          php tests/task-details.php
          php tests/task-admin-performance.php
      - name: Capture, preflight or deploy the authorized Task editing files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-task-admin-edit.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-admin-edit-${{ github.run_id }}
          path: |
            task-admin-edit-live-source.zip
            task-admin-edit-deployment-backup.zip
            task-admin-edit-deployment-report.json
          if-no-files-found: warn
