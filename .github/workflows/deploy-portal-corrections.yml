name: Deploy responsive HR sidebar
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture source, preflight, or deploy scoped policy files
        required: true
        type: choice
        options: [export, preflight, deploy]
      approved_sha:
        description: Exact authorized branch commit SHA
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  leave-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: fileinfo, pdo_mysql
      - name: Capture, preflight or deploy the sidebar stylesheet only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-hr-sidebar.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-sidebar-${{ github.run_id }}
          path: |
            hr-sidebar-live-source.zip
            hr-sidebar-deployment-backup.zip
            hr-sidebar-deployment-report.json
          if-no-files-found: warn
