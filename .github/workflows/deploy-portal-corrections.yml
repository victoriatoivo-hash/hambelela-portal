name: Deploy approved Portal Corrections

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only or publish exact approved files
        required: true
        type: choice
        options:
          - preflight
          - deploy
      approved_sha:
        description: Exact main commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  portal-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Validate exact release files
        run: |
          php -l apps/operations/reports.php
          php -l apps/operations/kpi-employee.php
          php -l apps/operations/performance-timing-settings.php
          node --check assets/js/reports-business-health.js
          node --check assets/js/reports-section.js
          node tests/performance-report-workspace-static.mjs
      - name: Preflight or deploy approved delta with backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-performance-report-workspace.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report-workspace-${{ github.run_id }}
          path: |
            performance-report-workspace-report.json
            performance-report-workspace-backup.zip
          if-no-files-found: warn
