name: Deploy Orders payment editing and POS sync
on:
  workflow_dispatch:
    inputs:
      approved_sha: {required: true, type: string, description: Exact approved commit}
      mode: {required: true, type: choice, options: [preflight, deploy], description: Verify or publish}
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  permission:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          php tests/hope-orders-trash.php
          php tests/orders-pos-method.php
          node --check assets/js/orders-board.js
          node tests/orders-move-to-trash-static.mjs
          php -l apps/operations/orders-board-data.php
          php -l apps/operations/orders-board-action.php
      - name: Verify live guards, back up and apply only approved permission changes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-orders-payment-delta.py "$MODE" "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders-payment-rollback-${{ github.run_id }}
          path: orders-payment-backup.zip
          retention-days: 3
          if-no-files-found: warn
