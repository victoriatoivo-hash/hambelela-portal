name: Deploy HR unified interface
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture source, preflight, or deploy scoped HR interface files
        required: true
        type: choice
        options: [export, preflight, deploy]
      approved_sha:
        description: Exact authorized branch commit SHA
        required: true
        type: string
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  leave-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: fileinfo, pdo_mysql, pdo_sqlite
      - name: Verify dashboard data and preserved acknowledgements
        if: inputs.mode != 'export'
        run: php tests/hr-unified-interface.php
      - name: Capture, preflight or deploy the authorized HR interface files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/deploy-hr-interface.py "$MODE" "$APPROVED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-interface-${{ github.run_id }}
          path: |
            hr-interface-live-source.zip
            hr-interface-deployment-backup.zip
            hr-interface-deployment-report.json
          if-no-files-found: warn
