name: Deploy Marketing employee task visibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight only or publish the exact employee workspace file
        required: true
        type: choice
        options:
          - preflight
          - deploy
      approved_sha:
        description: Exact main commit SHA to verify and deploy
        required: true
        type: string

concurrency:
  group: production-delta-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate employee task visibility release
        run: |
          php -l apps/marketing/employee-workspace.php
          node tests/marketing-assigned-tasks-static.mjs
      - name: Preflight or deploy exact approved file with backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-marketing-employee-tasks.py "${{ inputs.mode }}" "${{ inputs.approved_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-employee-tasks-${{ github.run_id }}
          path: |
            marketing-employee-tasks-report.json
            marketing-employee-tasks-backup.zip
          if-no-files-found: warn
