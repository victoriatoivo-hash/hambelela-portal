name: Deploy DPO and EFT payment synchronization
on:
  push:
    branches: [codex/dpo-eft-payment-sync]
    paths: [.github/workflows/deploy-payment-sync.yml, scripts/deploy-payment-sync.py, scripts/payment-sync-patches.json, apps/operations/orders-gateway-sync.php, tests/orders-dpo-eft-behavior.php]
permissions:
  contents: read
concurrency:
  group: production-delta-deployment
  cancel-in-progress: false
jobs:
  payment-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify payment state transitions and source syntax
        run: |
          php tests/orders-dpo-eft-behavior.php
          php -l apps/operations/orders-gateway-sync.php
          node --check assets/js/orders-board.js
      - name: Back up on host and apply isolated verified payment patches
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-payment-sync.py
